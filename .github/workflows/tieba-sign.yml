name: tieba-sign

on:
  schedule:
    # 每日签到（GitHub cron 用 UTC；例如北京时间 08:10 = UTC 00:10）
    - cron: "10 0 * * *"
    - cron: "10 4 * * *"
    - cron: "10 8 * * *"
    # 每月 keepalive：制造一次 commit 活动，防止 60 天无 commit 导致 schedule 被禁用
    - cron: "25 0 1 * *"
  workflow_dispatch:

# 默认最小权限；需要写入时在 job 内单独提升
permissions:
  contents: read

concurrency:
  group: tieba-sign
  cancel-in-progress: false

jobs:
  sign:
    # 仅 workflow_dispatch 或“每日 cron”执行（避免每月 keepalive 那次也跑一遍签到）
    if: |
      github.ref == 'refs/heads/master' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && github.event.schedule != '25 0 1 * *')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (uv)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "uv.lock" ]]; then
            uv sync --frozen --no-dev
          elif [[ -f "requirements.txt" ]]; then
            uv pip install -r requirements.txt
          else
            echo "ERROR: uv.lock/requirements.txt not found." >&2
            exit 1
          fi

      - name: Run sign
        env:
          BDUSS: ${{ secrets.BDUSS }}
          # 按你脚本支持的环境变量自行调整
          MAX_WORKERS: "3"
          DEBUG: "0"
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${BDUSS}"
          uv run python main.py

  keepalive:
    # 仅“每月 cron”执行：向 keepalive 分支推一个小提交
    if: github.event_name == 'schedule' && github.event.schedule == '25 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout (need credentials for push)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Keep repo active (commit to keepalive branch)
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="keepalive"
          FILE=".github/keepalive.txt"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 准备 keepalive 分支（存在则在其上追加；不存在则创建）
          git fetch origin "${BRANCH}" --depth=1 || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -B "${BRANCH}"
          fi

          mkdir -p "$(dirname "${FILE}")"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "${FILE}"

          git add "${FILE}"
          git commit -m "chore: keepalive (auto)" || exit 0
          git push origin "${BRANCH}"